
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Battle x3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial;text-align:center}
header{padding:14px;background:#181818;border-bottom:1px solid #444}
h2{margin:3px;color:#ffe17b}
#arena{display:block;width:min(94vw,650px);height:min(94vw,650px);max-height:65vh;margin:14px auto;background:#000;border:2px solid #444;border-radius:12px}
.panel{width:min(94vw,650px);margin:auto;background:#191919;padding:12px;border-radius:12px}
.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap}
.hp{height:13px;background:#333;border-radius:20px;overflow:hidden;margin:6px}
.hp div{height:100%;transition:width .15s}
button,select{background:#292929;color:white;border:1px solid #777;border-radius:8px;padding:10px;margin:4px}
#log{height:90px;overflow:auto;text-align:left;font-size:13px;color:#ddd;margin-top:10px}
</style>
</head>
<body>
<header>
<h2>⭕ CIRCLE BATTLE</h2>
100 ORB SKINS · AUTO BATTLE · SPEED x3
</header>

<canvas id="arena" width="650" height="650"></canvas>

<div class="panel">
 <div class="stats">
  <div>🟢 <b id="name1"></b><br>HP: <span id="hp1">100</span></div>
  <div>🔴 <b id="name2"></b><br>HP: <span id="hp2">100</span></div>
 </div>
 <div class="hp"><div id="bar1" style="width:100%;background:#4bea61"></div></div>
 <div class="hp"><div id="bar2" style="width:100%;background:#fa6680"></div></div>
 <p>Round <b id="round">1</b> · <b id="status">Đang chiến đấu</b></p>
 <button onclick="restart()">🔄 Chơi lại</button>
 <button onclick="nextRound()">⏭ Round tiếp</button>
 <br>
 <label>Quả cầu 1</label>
 <select id="pick1"></select>
 <label>Quả cầu 2</label>
 <select id="pick2"></select>
 <button onclick="changeOrbs()">Chọn skin</button>
 <div id="log"></div>
</div>

<script>
const canvas=document.getElementById("arena");
const ctx=canvas.getContext("2d");
const W=650,H=650;
const SPEED=3;

const names=[
"Ma Cà Rồng","Nhện Độc","Cầu Sét","Băng Giá","Hỏa Diệm",
"Thiên Thần","Bóng Tối","Đá Núi","Cuồng Phong","Lá Hồi Sinh",
"Độc Vương","Dung Nham","Thủy Quái","Ảo Ảnh","Vệ Binh",
"Phượng Hoàng","Hắc Long","Bạch Hổ","Sói Băng","Ong Máy",
"Thần Sấm","Hoa Ăn Thịt","Kỵ Sĩ","Mặt Trăng","Mặt Trời",
"Robot","Nam Châm","Pha Lê","Cát Lún","Bão Tuyết",
"Khói Đen","Linh Hồn","Bom Nổ","Khiên Vàng","Kiếm Bay",
"Rồng Đỏ","Rồng Xanh","Rùa Đá","Cá Mập","Bạch Tuộc",
"Phù Thủy","Pháp Sư Lửa","Thợ Săn","Thần Rừng","Nấm Độc",
"Quỷ Nhỏ","Thiên Sứ","Bóng Ma","Tinh Thể","Sao Băng",
"Vua Băng","Vua Lửa","Vua Sét","Vua Độc","Vua Gió",
"Thần Kim Loại","Thần Mộc","Thần Thủy","Thần Thổ","Thần Hỏa",
"Siêu Tân Tinh","Hố Đen","Ngân Hà","Không Gian","Thời Gian",
"Phân Thân","Hấp Thụ","Phản Đòn","Cuồng Nộ","Bất Tử",
"Thợ Săn Bóng Đêm","Bọ Cạp","Bọ Ngựa","Dơi Đêm","Bọ Rùa",
"Thiết Giáp","Thủy Tinh","San Hô","Sứa Điện","Cáo Lửa",
"Chim Băng","Hổ Sấm","Gấu Đá","Rắn Độc","Kỳ Lân",
"Quái Vật Kẹo","Bánh Răng","Đồng Hồ","Mắt Thần","Tinh Linh",
"Vũ Trụ","Hỗn Mang","Thiên Hà","Hủy Diệt","Sáng Thế",
"Hoàng Kim","Huyết Nguyệt","Thần Hộ Mệnh","Vua Các Orb"
];

const colors=[
"#62e85b","#b56aff","#ffe34d","#74dfff","#ff713b",
"#fff3b0","#8c65bd","#aaa69b","#8cecff","#7bdb82",
"#a5e34c","#ff4c26","#38bce8","#d58cff","#e7c77a",
"#ffbb55","#a13b3b","#eeeeee","#8edfff","#ffdd66"
];

const powers=[
"Hút máu","Giăng tơ","Phóng điện","Đóng băng","Thiêu đốt",
"Tạo khiên","Bóng tối","Giáp đá","Tăng tốc","Hồi máu"
];

const skins=names.map((name,i)=>({
 name,color:colors[i%colors.length],
 type:i%10,strength:1+(Math.floor(i/10)*.08)
}));

for(let i=0;i<100;i++){
 pick1.add(new Option((i+1)+". "+names[i],i));
 pick2.add(new Option((i+1)+". "+names[i],i));
}
pick1.value=9;pick2.value=0;

let round=1,orbA,orbB,particles=[],running=true;

function makeOrb(index,x,y){
 return {
  skin:skins[index],x,y,
  vx:(Math.random()*5-2.5)*SPEED,
  vy:(Math.random()*5-2.5)*SPEED,
  hp:100,r:29,cooldown:0,burn:0,freeze:0,shield:0
 };
}

function log(msg){
 const box=document.getElementById("log");
 box.innerHTML=msg+"<br>"+box.innerHTML;
}

function restart(){
 orbA=makeOrb(+pick1.value,130,325);
 orbB=makeOrb(+pick2.value,520,325);
 particles=[];running=true;
 document.getElementById("status").textContent="Đang chiến đấu";
 document.getElementById("round").textContent=round;
 document.getElementById("log").innerHTML="";
 updateUI();
 log("⚔️ Round "+round+" bắt đầu!");
}

function nextRound(){round++;restart()}
function changeOrbs(){restart()}

function updateUI(){
 document.getElementById("name1").textContent=orbA.skin.name;
 document.getElementById("name2").textContent=orbB.skin.name;
 document.getElementById("hp1").textContent=Math.max(0,Math.ceil(orbA.hp));
 document.getElementById("hp2").textContent=Math.max(0,Math.ceil(orbB.hp));
 document.getElementById("bar1").style.width=Math.max(0,orbA.hp)+"%";
 document.getElementById("bar2").style.width=Math.max(0,orbB.hp)+"%";
}

function burst(x,y,color,count=12){
 for(let i=0;i<count;i++){
  particles.push({x,y,vx:Math.random()*8-4,vy:Math.random()*8-4,life:30,color});
 }
}

function damage(target,amount){
 if(target.shield>0){amount*=.35;target.shield--}
 target.hp-=amount;
 burst(target.x,target.y,target.skin.color,5);
}

function usePower(a,b){
 const type=a.skin.type,p=a.skin.strength;
 switch(type){
 case 0:
  a.hp=Math.min(100,a.hp+5*p);damage(b,5*p);
  log("🧛 "+a.skin.name+" hút máu!");
  break;
 case 1:
  b.freeze=35;damage(b,4*p);log("🕷️ Nhện giăng tơ!");
  break;
 case 2:
  b.freeze=22;damage(b,9*p);burst(a.x,a.y,"#fff36b",20);
  log("⚡ Điện giật!");
  break;
 case 3:
  b.freeze=65;damage(b,3*p);log("❄️ Đóng băng!");
  break;
 case 4:
  b.burn=100;damage(b,5*p);log("🔥 Thiêu đốt!");
  break;
 case 5:
  a.shield=3;damage(b,4*p);log("✨ Khiên bảo vệ!");
  break;
 case 6:
  damage(b,7*p);a.vx*=-1.5;a.vy*=-1.5;
  log("🌑 Bóng tối tấn công!");
  break;
 case 7:
  a.shield=5;damage(b,3*p);log("🪨 Giáp đá!");
  break;
 case 8:
  a.vx*=1.8;a.vy*=1.8;damage(b,6*p);
  log("🌪️ Cuồng phong!");
  break;
 case 9:
  a.hp=Math.min(100,a.hp+10*p);damage(b,3*p);
  log("🌿 Hồi máu!");
  break;
 }
}

function moveOrb(o){
 if(o.freeze>0){o.freeze--;return}

 if(o.burn>0){
  o.burn--;
  if(o.burn%20===0)o.hp-=1.5;
 }
 if(o.cooldown>0)o.cooldown--;

 // Tự lăn ngẫu nhiên: tốc độ x3
 o.vx+=(Math.random()-.5)*1.05;
 o.vy+=(Math.random()-.5)*1.05;

 const speed=Math.hypot(o.vx,o.vy);
 const maxSpeed=12.6;
 const minSpeed=3.6;

 if(speed>maxSpeed){
  o.vx=o.vx/speed*maxSpeed;
  o.vy=o.vy/speed*maxSpeed;
 }
 if(speed<minSpeed){
  o.vx*=1.15;o.vy*=1.15;
 }

 o.x+=o.vx;o.y+=o.vy;

 if(o.x<o.r||o.x>W-o.r)o.vx*=-1;
 if(o.y<o.r||o.y>H-o.r)o.vy*=-1;

 o.x=Math.max(o.r,Math.min(W-o.r,o.x));
 o.y=Math.max(o.r,Math.min(H-o.r,o.y));
}

function collide(){
 const dx=orbB.x-orbA.x,dy=orbB.y-orbA.y;
 const dist=Math.hypot(dx,dy);

 if(dist<orbA.r+orbB.r){
  const nx=dx/(dist||1),ny=dy/(dist||1);
  const overlap=orbA.r+orbB.r-dist;

  orbA.x-=nx*overlap/2;orbA.y-=ny*overlap/2;
  orbB.x+=nx*overlap/2;orbB.y+=ny*overlap/2;

  const av=orbA.vx*nx+orbA.vy*ny;
  const bv=orbB.vx*nx+orbB.vy*ny;

  orbA.vx+=(bv-av)*nx;orbA.vy+=(bv-av)*ny;
  orbB.vx+=(av-bv)*nx;orbB.vy+=(av-bv)*ny;

  if(orbA.cooldown===0){
   usePower(orbA,orbB);orbA.cooldown=45;
  }
  if(orbB.cooldown===0){
   usePower(orbB,orbA);orbB.cooldown=45;
  }
 }
}

function drawOrb(o){
 ctx.save();
 ctx.shadowBlur=18;ctx.shadowColor=o.skin.color;
 ctx.fillStyle=o.skin.color;
 ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.strokeStyle="#171717";ctx.lineWidth=5;ctx.stroke();

 // Khuôn mặt quả cầu
 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(o.x-10,o.y-5,4,0,7);
 ctx.arc(o.x+10,o.y-5,4,0,7);
 ctx.fill();

 ctx.strokeStyle="#111";ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(o.x,o.y+5,8,.2,Math.PI-.2);ctx.stroke();

 // Hai răng nanh của Ma Cà Rồng
 if(o.skin.name==="Ma Cà Rồng"){
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.moveTo(o.x-9,o.y+5);ctx.lineTo(o.x-5,o.y+16);ctx.lineTo(o.x-2,o.y+5);
  ctx.moveTo(o.x+2,o.y+5);ctx.lineTo(o.x+5,o.y+16);ctx.lineTo(o.x+9,o.y+5);
  ctx.fill();
 }

 // Trang trí nhận diện nhện
 if(o.skin.name==="Nhện Độc"){
  ctx.strokeStyle="#222";ctx.lineWidth=3;
  for(let i=-1;i<=1;i++){
   ctx.beginPath();
   ctx.moveTo(o.x-22,o.y+i*9);
   ctx.lineTo(o.x-36,o.y+i*13);
   ctx.moveTo(o.x+22,o.y+i*9);
   ctx.lineTo(o.x+36,o.y+i*13);
   ctx.stroke();
  }
 }

 ctx.fillStyle="white";ctx.font="bold 12px Arial";
 ctx.textAlign="center";ctx.fillText(o.skin.name,o.x,o.y+45);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle="#333";ctx.lineWidth=4;
 ctx.strokeRect(2,2,W-4,H-4);

 particles.forEach(p=>{
  ctx.globalAlpha=p.life/30;
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
  p.x+=p.vx;p.y+=p.vy;p.life--;
 });
 ctx.globalAlpha=1;
 particles=particles.filter(p=>p.life>0);

 drawOrb(orbA);drawOrb(orbB);
}

function loop(){
 if(running){
  moveOrb(orbA);
  moveOrb(orbB);
  collide();

  if(orbA.hp<=0||orbB.hp<=0){
   running=false;
   const winner=orbA.hp>0?orbA:orbB;
   document.getElementById("status").textContent="🏆 "+winner.skin.name+" chiến thắng!";
   log("🏆 "+winner.skin.name+" thắng Round "+round+"!");
  }
  updateUI();
 }
 draw();
 requestAnimationFrame(loop);
}

restart();
requestAnimationFrame(loop);
</script>
</body>
</html>
